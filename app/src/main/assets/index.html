<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Turbo Monedas</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
  .ctl{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;
       background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.6);color:#fff;font-size:30px;
       display:flex;align-items:center;justify-content:center;touch-action:none;z-index:3}
  .ctl.on{background:rgba(255,255,255,.55)}
  #bL{left:calc(16px + env(safe-area-inset-left))}
  #bR{left:calc(104px + env(safe-area-inset-left))}
  #bJ{right:calc(20px + env(safe-area-inset-right));width:92px;height:92px;font-size:34px}
  #pause{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));width:44px;height:44px;
         border-radius:12px;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.25);color:#fff;font-size:20px;z-index:3}
  body.swap #bJ{right:auto;left:calc(20px + env(safe-area-inset-left))}
  body.swap #bL{left:auto;right:calc(104px + env(safe-area-inset-right))}
  body.swap #bR{left:auto;right:calc(16px + env(safe-area-inset-right))}
  body.nobtn .ctl{display:none}
  .modes{display:flex;gap:6px;margin:6px 0 10px}.modes .pill{flex:1;min-width:0}
  .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
  .opt b{font-size:16px}.opt span{display:block;font-size:13px;opacity:.75;font-weight:400}
  .pill{min-width:92px;padding:10px;border-radius:12px;border:0;font-weight:700;font-size:15px;background:#2fbf4f;color:#fff}
  .pill.off{background:#555}
  @media (hover:hover) and (pointer:fine){.ctl{display:none}}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,18,48,.8);
           color:#fff;text-align:center;z-index:5;overflow:auto;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
  .card{max-width:440px;padding:16px}
  h1{margin:4px 0 2px;font-size:30px;letter-spacing:.5px;color:#ffd23f;text-shadow:0 3px 0 #b5651d}
  .sub{margin:0 0 10px;opacity:.85}
  .face{margin:8px auto;width:96px;height:96px}
  .btn{display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:13px;border-radius:14px;border:0;font-size:18px;font-weight:700;
       background:#2b4a8f;color:#fff;cursor:pointer}
  .btn.go{background:#2fbf4f}
  .btn{position:relative;overflow:hidden}
  .btn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:200px;cursor:pointer}
  .msg{font-size:14px;color:#ffd23f;min-height:18px;margin:4px 0}
  .hint{font-size:13px;opacity:.8;line-height:1.4}
  .stats{font-size:18px;margin:8px 0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ctl" id="bL">◀</div>
<div class="ctl" id="bR">▶</div>
<div class="ctl" id="bJ">⤒</div>
<button id="pause" style="display:none">☰</button>
<div id="overlay"><div class="card" id="card"></div></div>

<script src="js/base.js"></script>
<script src="js/nivel1-plataformas.js"></script>
<script src="js/nivel2-carrera.js"></script>
<script src="js/pantallas.js"></script>
<script src="js/principal.js"></script>
</body>
</html>
